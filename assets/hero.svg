<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="title desc">
<title id="title">clssck: Engineer</title>
<desc id="desc">A terminal window under a starry sky. The command whoami prints: clssck. Engineer. I make annoying things easier. A cat watches a ball of yarn from behind the window.</desc>
<style>
  /* Catppuccin Mocha; Latte replaces it when the viewer prefers a light scheme. */
  svg {
    --crust: #11111b; --mantle: #181825; --base: #1e1e2e;
    --surface0: #313244; --surface1: #45475a; --surface2: #585b70;
    --overlay1: #7f849c; --subtext0: #a6adc8; --text: #cdd6f4;
    --rosewater: #f5e0dc; --flamingo: #f2cdcd; --pink: #f5c2e7; --mauve: #cba6f7;
    --red: #f38ba8; --peach: #fab387; --yellow: #f9e2af; --green: #a6e3a1;
    --star: #cdd6f4; --fur: #bac2de; --paw: #cdd6f4; --pupil: #11111b;
  }
  @media (prefers-color-scheme: light) {
    svg {
      --crust: #dce0e8; --mantle: #e6e9ef; --base: #eff1f5;
      --surface0: #ccd0da; --surface1: #bcc0cc; --surface2: #acb0be;
      --overlay1: #8c8fa1; --subtext0: #6c6f85; --text: #4c4f69;
      --rosewater: #dc8a78; --flamingo: #dd7878; --pink: #ea76cb; --mauve: #8839ef;
      --red: #d20f39; --peach: #fe640b; --yellow: #df8e1d; --green: #40a02b;
      --star: #8c8fa1; --fur: #7c7f93; --paw: #9ca0b0; --pupil: #4c4f69;
    }
  }
  text { font-family: ui-monospace, "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace; }
  .crust { fill: var(--crust); } .mantle { fill: var(--mantle); } .base { fill: var(--base); }
  .surface0 { fill: var(--surface0); } .overlay1 { fill: var(--overlay1); } .subtext0 { fill: var(--subtext0); }
  .text { fill: var(--text); } .rosewater { fill: var(--rosewater); } .flamingo { fill: var(--flamingo); }
  .pink { fill: var(--pink); } .mauve { fill: var(--mauve); } .red { fill: var(--red); } .peach { fill: var(--peach); }
  .yellow { fill: var(--yellow); } .green { fill: var(--green); }
  .fur { fill: var(--fur); } .paw { fill: var(--paw); } .pupil { fill: var(--pupil); }
  .sky { stroke: var(--star); fill: var(--star); }
  .dust { stroke: var(--surface2); fill: var(--surface2); }
  .rise { animation: rise .7s cubic-bezier(.22, 1, .36, 1) both; }
  .key { animation: key .01s step-end both; }
  .cursor { animation: blink 1.1s step-end infinite; }
  .star { animation: twinkle 4.2s ease-in-out infinite; }
  .yarn { transform-origin: 806px 0; animation: swing 5s ease-in-out infinite; }
  .eye { transform-box: fill-box; transform-origin: center; animation: wink 6s linear infinite; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  @keyframes key { from { fill-opacity: 0; } }
  @keyframes blink { 50% { fill-opacity: 0; } }
  @keyframes twinkle { 50% { opacity: .25; } }
  @keyframes swing { 0%, 100% { transform: rotate(-3.5deg); } 50% { transform: rotate(3.5deg); } }
  @keyframes wink { 0%, 46%, 50%, 100% { transform: scaleY(1); } 48% { transform: scaleY(.1); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <clipPath id="frame"><rect width="880" height="360" rx="18"/></clipPath>
  <clipPath id="above-window"><rect width="880" height="58"/></clipPath>
  <path id="spark" d="M0-5V5M-5 0H5" fill="none" stroke-width="1.2" stroke-linecap="round"/>
  <path id="glint" d="M0-8C.9-2.4 2.4-.9 8 0 2.4.9.9 2.4 0 8-.9 2.4-2.4.9-8 0-2.4-.9-.9-2.4 0-8Z" stroke="none"/>
</defs>

<g clip-path="url(#frame)">
  <rect class="crust" width="880" height="360"/>
  <path class="mantle" d="M0 132C110 96 210 168 360 128S640 84 880 138V360H0Z"/>
  <path class="surface0" d="M0 262C160 226 300 288 470 252S740 222 880 266V360H0Z" opacity=".45"/>

