  <path d="M48 98H832" style="stroke: var(--surface0)"/>
  <circle class="red" cx="72" cy="78" r="6"/>
  <circle class="yellow" cx="92" cy="78" r="6"/>
  <circle class="green" cx="112" cy="78" r="6"/>
  <text class="overlay1" x="136" y="83" font-size="14">visitor@clssck — zsh</text>

  <g class="dust">
    <use href="#spark" x="470" y="150" class="star" style="animation-delay:-2.9s"/>
    <use href="#spark" x="612" y="124" class="star" style="animation-delay:-1.1s"/>
    <use href="#spark" x="790" y="132" class="star" style="animation-delay:-.9s"/>
    <use href="#spark" x="764" y="224" class="star" style="animation-delay:-2.4s"/>
    <use href="#spark" x="548" y="198" class="star" style="animation-delay:-1.7s"/>
    <use href="#spark" x="798" y="296" class="star" style="animation-delay:-3.3s"/>
    <use href="#glint" x="676" y="168" class="star" style="animation-delay:-2s"/>
    <use href="#glint" transform="translate(736 278) scale(.6)" class="star" style="animation-delay:-.5s"/>
    <g stroke="none">
      <circle cx="420" cy="118" r="1.3"/><circle cx="742" cy="118" r="1.1"/><circle cx="806" cy="204" r="1.4"/>
      <circle cx="640" cy="216" r="1.1"/><circle cx="578" cy="164" r="1.4"/><circle cx="690" cy="308" r="1.4"/>
    </g>
  </g>

  <ellipse class="paw" cx="704" cy="59" rx="9" ry="5.5"/>
  <ellipse class="paw" cx="744" cy="59" rx="9" ry="5.5"/>

  <text class="overlay1" x="76" y="134" font-size="16"><tspan class="mauve">visitor@clssck</tspan>:~<tspan class="text">$ </tspan><tspan class="text"><tspan class="key" style="animation-delay:.5s">w</tspan><tspan class="key" style="animation-delay:.62s">h</tspan><tspan class="key" style="animation-delay:.74s">o</tspan><tspan class="key" style="animation-delay:.86s">a</tspan><tspan class="key" style="animation-delay:.98s">m</tspan><tspan class="key" style="animation-delay:1.1s">i</tspan></tspan></text>
  <text class="rise text" style="animation-delay:1.45s" x="72" y="214" font-size="76" font-weight="800" letter-spacing="-3">clssck</text>
  <text class="rise text" style="animation-delay:1.75s" x="76" y="254" font-size="26">Engineer. I make annoying things easier.</text>
  <text class="rise subtext0" style="animation-delay:2.05s" x="76" y="282" font-size="14" letter-spacing="1.5">GO / TYPESCRIPT / OBSCURE SOFTWARE NOBODY ELSE WANTS TO TOUCH</text>
  <text class="rise overlay1" style="animation-delay:2.5s" x="76" y="314" font-size="16"><tspan class="mauve">visitor@clssck</tspan>:~<tspan class="text">$ </tspan><tspan class="cursor rosewater">█</tspan></text>

  <rect x=".5" y=".5" width="879" height="359" rx="17.5" fill="none" style="stroke: var(--surface0)"/>
</g>
