    <g stroke="none">
      <circle cx="66" cy="34" r="1.4"/><circle cx="340" cy="44" r="1.2"/><circle cx="640" cy="34" r="1.5"/>
      <circle cx="20" cy="196" r="1.3"/><circle cx="862" cy="92" r="1.4"/><circle cx="338" cy="348" r="1.2"/>
    </g>
  </g>
  <g class="yellow">
    <circle cx="170" cy="38" r="1.6"/><circle cx="580" cy="42" r="1.4"/><circle cx="858" cy="246" r="1.5"/><circle cx="22" cy="330" r="1.4"/>
  </g>

  <g class="yarn">
    <path d="M806 0V26" fill="none" style="stroke: var(--yellow)" stroke-width="1.2"/>
    <circle class="peach" cx="806" cy="36" r="10"/>
    <path d="M798 31c5-3 12-3 16 1M797 38c6-4 13-4 18 0M801 44c4-9 8-13 12-15" fill="none" style="stroke: var(--red)" stroke-width="1.1" stroke-linecap="round"/>
