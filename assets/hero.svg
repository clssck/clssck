    <path class="pink" d="M700 40 700 24 712 34ZM748 40 748 24 736 34Z" opacity=".8"/>
    <ellipse class="fur" cx="724" cy="62" rx="34" ry="30"/>
    <ellipse class="eye green" cx="711" cy="48" rx="4.2" ry="5.4"/>
    <ellipse class="eye green" cx="737" cy="48" rx="4.2" ry="5.4"/>
    <ellipse class="eye pupil" cx="712.6" cy="48" rx="1.4" ry="4.2"/>
    <ellipse class="eye pupil" cx="738.6" cy="48" rx="1.4" ry="4.2"/>
    <path class="flamingo" d="M721.5 54h5l-2.5 3Z"/>
